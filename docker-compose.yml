x-runtime: &runtime
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - stock-data:/app/data
    - stock-logs:/app/logs

services:
  web:
    <<: *runtime
    ports:
      - '127.0.0.1:8000:8000'
    command: ['uvicorn', 'web.app:app', '--host', '0.0.0.0', '--port', '8000']
  worker:
    <<: *runtime
    command: ['python', '-m', 'lib.cli', 'worker']
    healthcheck:
      disable: true
  scheduler:
    <<: *runtime
    command: ['python', '-m', 'lib.cli', 'scheduler']
    healthcheck:
      disable: true
  notify-worker:
    <<: *runtime
    command: ['python', '-m', 'lib.cli', 'notify-worker']
    healthcheck:
      disable: true

volumes:
  stock-data:
  stock-logs:
